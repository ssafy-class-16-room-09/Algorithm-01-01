
name: 문제 등록

on:
  issues:
    # opened와 labeled의 중복 실행 방지
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: problem-register-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  register:
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'problem')
      || contains(github.event.issue.body, '### 문제 목록')

    runs-on: ubuntu-latest

    steps:
      # 1. 기본 브랜치 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # 2. 이슈별 작업 브랜치 생성 또는 재사용
      - name: 작업 브랜치 준비
        id: branch
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          BRANCH="register/issue-${ISSUE}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" FETCH_HEAD
          else
            git switch -c "$BRANCH"
          fi

      # 3. 기존 이슈 파싱 및 폴더 생성
      - name: 이슈 파싱 및 문제 폴더 생성
        id: register
        uses: actions/github-script@v7
        with:
          script: |
            const mod = await import(`file://${process.env.GITHUB_WORKSPACE}/.github/scripts/register-problem.mjs`);
            await mod.run({ github, context, core });

      # 4. 현황판 갱신 및 작업 브랜치 Push
      - name: 문제 폴더 커밋 및 현황판 갱신
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TITLE: ${{ steps.register.outputs.title }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          node .github/scripts/build-leaderboard.mjs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add solutions README.md

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          git commit -m "chore: ${TITLE} 문제 폴더 생성 (#${ISSUE})"
          git push -u origin "$BRANCH"

          echo "작업 브랜치 Push 완료: $BRANCH"
          echo "이제 해당 브랜치에서 main으로 PR을 생성하세요."
